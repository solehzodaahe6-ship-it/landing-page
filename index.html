<!DOCTYPE html>
<html lang="tg">
<head>
  <!-- ===== ТАНЗИМОТИ САҲИФА =====
       Барои чӣ: забон, ҳарфҳо ва андозаи экран дар телефон -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Номи сайт дар болои табаки браузер -->
  <title>Лендинги ман</title>

  <!-- Пайваст кардани файли намуд (style.css) -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===== HEADER (САР) =====
       Барои чӣ: лого ва менюи болои сайт -->
  <header class="header">
    <div class="logo">МоБренд</div>
    <nav>
      <a href="#services">Хизматҳо</a>
      <a href="#contact">Тамос</a>
    </nav>
  </header>

  <!-- ===== HERO (ҚИСМИ АСОСӣ) =====
       Барои чӣ: аввалин чизе ки меҳмон мебинад: сарлавҳа ва тугма -->
  <section class="hero">
    <h1>Сарлавҳаи асосии шумо</h1>
    <p>Як ҷумла: шумо чӣ медиҳед ва ба муштарӣ чӣ фоида меорад.</p>
    <a href="#contact" class="btn">Ҳозир фармоиш диҳед</a>
  </section>

  <!-- ===== SERVICES (ХИЗМАТҲО) =====
       Барои чӣ: 3 корти хизмат ё афзалият -->
  <section id="services" class="services">
    <h2>Хизматҳои мо</h2>
    <div class="cards">
      <div class="card"><h3>Хизмати 1</h3><p>Тавсифи кӯтоҳ</p></div>
      <div class="card"><h3>Хизмати 2</h3><p>Тавсифи кӯтоҳ</p></div>
      <div class="card"><h3>Хизмати 3</h3><p>Тавсифи кӯтоҳ</p></div>
    </div>
  </section>

<!-- ===== CONTACT (ТАМОС) =====
     Барои чӣ: форма, ки маълумотро ба Netlify мефиристад.
     data-netlify="true" = Netlify формаро худаш мешиносад.
     name="..." дар ҳар майдон ҳатмист, вагарна маълумот намеояд. -->
<form id="form" name="contact" method="POST" data-netlify="true">
  <input type="hidden" name="form-name" value="contact">
  <input type="text" name="name" placeholder="Номи шумо" required>
  <input type="tel" name="phone" placeholder="Рақами телефон" required>
  <button type="submit" class="btn">Фиристодан</button>
</form>

  <!-- ===== FOOTER (ПОЁН) =====
       Барои чӣ: ҳуқуқи муаллиф ва маълумоти охирин -->
  <footer class="footer">
    © 2026 МоБренд
  </footer>

  <!-- Пайваст кардани файли ҳаракат (script.js) -->
  <script src="script.js"></script>
</body>
</html>
